<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PR Watcher</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">

<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .sev-critical { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .sev-important { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .sev-suggestion { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }
  .sev-nit { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
  pre.snippet { background: #0f172a; color: #e2e8f0; padding: .75rem; border-radius: .5rem; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body class="bg-slate-50 text-slate-900">
<div x-data="app()" x-init="loadMeta(); load(); poll(); loadMyPrs(); pollMyPrs()" class="max-w-7xl mx-auto p-6">
<div class="flex gap-6 items-start">
<main class="flex-1 min-w-0 space-y-6">

  <header class="flex items-baseline justify-between">
    <h1 class="text-2xl font-semibold">PR Watcher</h1>
    <div class="flex items-center gap-3">
      <button @click="runWatcher('new_prs')"
              :disabled="fetching"
              class="px-3 py-1.5 rounded-md bg-slate-900 text-white text-xs hover:bg-slate-700 disabled:opacity-60"
              :class="fetching ? 'cursor-wait' : ''">
        <span x-show="!fetching">Fetch new PRs</span>
        <span x-show="fetching">Fetching…</span>
      </button>
      <div class="text-xs text-slate-500" x-text="'refreshed ' + lastRefresh"></div>
    </div>
  </header>

  <!-- Top-level view switch -->
  <nav class="flex items-center gap-1 border-b border-slate-200">
    <button @click="tab = 'queue'"
            :class="tab === 'queue'
              ? 'border-slate-900 text-slate-900'
              : 'border-transparent text-slate-500 hover:text-slate-800'"
            class="px-3 py-2 text-sm border-b-2 -mb-px">
      Review queue
    </button>
    <button @click="tab = 'mine'; loadMyTriage()"
            :class="tab === 'mine'
              ? 'border-slate-900 text-slate-900'
              : 'border-transparent text-slate-500 hover:text-slate-800'"
            class="px-3 py-2 text-sm border-b-2 -mb-px">
      My PRs
      <span x-show="myTriage.length" class="text-slate-400" x-text="'(' + myTriage.length + ')'"></span>
    </button>
  </nav>

  <!-- Watchers status -->
  <section class="grid grid-cols-3 gap-3 text-xs" x-show="tab === 'queue'">
    <template x-for="w in watchers" :key="w.name">
      <div class="bg-white border rounded-lg p-3">
        <div class="font-semibold" x-text="w.name"></div>
        <div class="text-slate-500" x-text="w.last_result || '—'"></div>
        <div class="text-slate-400 mt-1">
          last: <span x-text="fmtTime(w.last_run_at)"></span> ·
          next: <span x-text="fmtTime(w.next_run_at)"></span>
        </div>
      </div>
    </template>
    <template x-if="watchers.length === 0">
      <div class="col-span-3 text-slate-400 italic">No watcher runs yet.</div>
    </template>
  </section>

  <!-- Head PR -->
  <section x-show="tab === 'queue'">
    <h2 class="text-sm font-semibold uppercase text-slate-500 mb-2">
      Head PRs
      <span class="text-slate-400" x-show="heads.length > 0">(<span x-text="heads.length"></span>)</span>
    </h2>
    <div class="space-y-3">
    <template x-for="head in heads" :key="head.number">
      <div class="bg-white rounded-xl border shadow-sm p-5">
        <div class="flex items-start justify-between">
          <div>
            <div class="text-lg font-semibold">
              <a :href="head.url" target="_blank" class="hover:underline">
                #<span x-text="head.number"></span> · <span x-text="head.title"></span>
              </a>
            </div>
            <div class="text-sm text-slate-500">by <span x-text="head.author"></span></div>
            <div class="text-xs text-slate-400 mt-1" x-show="head.jira_summary" x-text="head.jira_summary"></div>
          </div>
          <div class="flex gap-2">
            <button @click="review(head.number)"
                    class="px-3 py-1.5 rounded-md bg-slate-100 border text-slate-700 text-sm hover:bg-slate-200"
                    title="Re-run Claude review">
              Review
            </button>
            <button @click="reviewDone(head.number)"
                    class="px-3 py-1.5 rounded-md bg-blue-100 border border-blue-300 text-blue-800 text-sm hover:bg-blue-200"
                    title="Mark review done — skips any remaining pending findings and moves the PR to Pending author action">
              Review done
            </button>
            <button @click="approve(head.number)"
                    class="px-3 py-1.5 rounded-md bg-emerald-600 text-white text-sm hover:bg-emerald-700">
              Approve
            </button>
            <button @click="approveIfAddressed(head.number)"
                    :disabled="checkingAddressed"
                    class="px-3 py-1.5 rounded-md bg-emerald-100 border border-emerald-300 text-emerald-800 text-sm hover:bg-emerald-200 disabled:opacity-60"
                    :class="checkingAddressed ? 'cursor-wait' : ''"
                    title="Run a Claude check on each of your inline comments on this PR. Approves only if all are addressed/explained/minor.">
              <span x-show="!checkingAddressed">Approve if addressed</span>
              <span x-show="checkingAddressed">Checking…</span>
            </button>
            <button @click="moveOffHead(head.number)"
                    class="px-3 py-1.5 rounded-md bg-slate-100 border text-slate-700 text-sm hover:bg-slate-200"
                    title="Move off head — keeps findings, lets another PR take the slot">
              Move off head
            </button>
            <button @click="dismiss(head.number)"
                    class="px-3 py-1.5 rounded-md bg-slate-200 text-slate-700 text-sm hover:bg-slate-300">
              Dismiss
            </button>
          </div>
        </div>

        <div class="mt-4 space-y-2">
          <div class="flex items-center gap-1 mb-3" x-show="head.findings.length > 0">
            <button @click="setFindingView('plain')"
                    :class="findingView === 'plain'
                      ? 'bg-slate-900 text-white border-slate-900'
                      : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'"
                    class="px-3 py-1.5 text-sm rounded-md border">
              Plain English
            </button>
            <button @click="setFindingView('technical')"
                    :class="findingView === 'technical'
                      ? 'bg-slate-900 text-white border-slate-900'
                      : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'"
                    class="px-3 py-1.5 text-sm rounded-md border">
              Technical
            </button>
            <span class="text-xs text-slate-400 ml-2">
              Post sends the technical comment, then the plain one as a reply.
            </span>
            <button @click="toggleChat(head.number)"
                    class="ml-auto px-3 py-1.5 text-sm rounded-md border border-slate-300 bg-white text-slate-700 hover:bg-slate-50">
              <span x-text="chatOpenFor === head.number ? 'Close chat' : 'Discuss with Claude'"></span>
            </button>
          </div>

          <!-- Per-PR conversation. Claude already has the review; it fetches the
               diff itself on the first message. -->
          <div x-show="chatOpenFor === head.number"
               class="mb-4 rounded-xl border border-slate-300 bg-slate-50 p-4">
            <div class="flex items-center justify-between mb-3">
              <div class="text-sm font-medium text-slate-700">Chat about this PR</div>
              <button @click="resetChat()"
                      class="text-xs text-slate-500 hover:text-slate-800 underline">Start over</button>
            </div>

            <div x-show="chatMessages.length === 0" class="text-sm text-slate-500 mb-3">
              Ask anything about this PR or the findings above. Claude reads the real
              diff, and can draft a comment for you to post.
            </div>

            <div class="space-y-3 mb-3">
              <template x-for="(m, mi) in chatMessages" :key="mi">
                <div>
                  <div x-show="m.role === 'user'" class="flex justify-end">
                    <div class="max-w-[85%] rounded-lg bg-slate-900 text-white px-3 py-2 text-sm whitespace-pre-wrap"
                         x-text="m.content"></div>
                  </div>
                  <div x-show="m.role === 'assistant'" class="space-y-2">
                    <template x-for="(part, pi) in chatParts(m.content)" :key="pi">
                      <div>
                        <div x-show="part.type === 'text'"
                             class="rounded-lg bg-white border border-slate-200 px-3 py-2 text-sm text-slate-800 leading-relaxed"
                             x-html="renderMd(part.body)"></div>
                        <div x-show="part.type === 'post'"
                             class="rounded-lg border border-blue-200 bg-blue-50 px-3 py-2">
                          <div class="text-xs text-blue-800 font-medium mb-1">
                            Draft comment — this is how it will look on the PR
                          </div>
                          <div class="text-sm text-slate-800" x-html="renderMd(part.body)"></div>
                          <button @click="postFromChat(part.body, mi + '-' + pi)"
                                  :disabled="posting !== null"
                                  class="mt-2 px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700 disabled:opacity-50">
                            <span x-text="posting === (mi + '-' + pi) ? 'Posting…' : 'Post this to the PR'"></span>
                          </button>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>

            <div x-show="chatBusy" class="flex items-center gap-2 text-sm text-slate-500 mb-2">
              <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" opacity=".25"/>
                <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="2"/>
              </svg>
              Claude is reading the PR…
            </div>

            <div x-show="chatError" class="text-sm text-red-600 mb-2" x-text="chatError"></div>

            <div class="flex gap-2">
              <input x-model="chatInput" @keydown.enter="sendChat()"
                     :disabled="chatBusy"
                     placeholder="Is finding 4 actually a problem?"
                     class="flex-1 px-3 py-2 text-sm rounded-md border border-slate-300 disabled:bg-slate-100" />
              <button @click="sendChat()" :disabled="chatBusy"
                      class="px-4 py-2 text-sm rounded-md bg-slate-900 text-white hover:bg-slate-700 disabled:opacity-50">
                Send
              </button>
            </div>
            <div class="text-xs text-slate-400 mt-2">
              Claude cannot post on its own. Anything sent to the PR goes through a button here.
            </div>
          </div>
          <template x-for="sev in ['critical', 'important', 'suggestion', 'nit']" :key="sev">
            <div x-show="findingsBySev(head, sev).length > 0">
              <div x-show="findingView === 'technical'"
                   class="text-xs font-semibold uppercase tracking-wide mb-1"
                   :class="{
                     'text-red-700': sev === 'critical',
                     'text-amber-700': sev === 'important',
                     'text-blue-700': sev === 'suggestion',
                     'text-slate-500': sev === 'nit',
                   }"
                   x-text="sev + ' (' + findingsBySev(head, sev).length + ')'"></div>
              <template x-for="f in findingsBySev(head, sev)" :key="f.id">
                <div>

                <!-- Plain English view: the default. Same finding, no jargon. -->
                <div x-show="findingView === 'plain'"
                     class="rounded-xl border bg-white mb-2 px-5 py-4"
                     :class="verdictRing(f)">
                  <div class="flex items-start justify-between gap-3">
                    <div class="flex items-start gap-3 min-w-0">
                      <span class="shrink-0 mt-0.5 w-6 h-6 rounded-full border flex items-center justify-center text-xs font-bold"
                            :class="verdictClass(f)"
                            x-text="verdictOf(f) === 'Your call' ? '?' : '!'"></span>
                      <h4 class="text-base font-semibold text-slate-900 leading-snug">
                        <span x-text="plainIndex(head, f) + '. '"></span><span x-text="plainTitle(f)"></span>
                      </h4>
                    </div>
                    <span class="shrink-0 text-xs px-2.5 py-1 rounded-full border font-medium"
                          :class="verdictClass(f)" x-text="verdictOf(f)"></span>
                  </div>

                  <p class="mt-2 text-sm text-slate-700 leading-relaxed" x-text="plainSummary(f)"></p>

                  <div x-show="f.plain_impact" class="mt-3 pt-3 border-t border-slate-100">
                    <div class="text-xs text-slate-500 mb-1" x-text="plainImpactLabel(f)"></div>
                    <p class="text-sm text-slate-700 leading-relaxed" x-text="f.plain_impact"></p>
                  </div>

                  <div class="mt-3 flex items-center gap-2">
                    <template x-if="f.status === 'pending'">
                      <div class="flex gap-2">
                        <button @click="postFinding(f.id)"
                                class="px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700">Post</button>
                        <button @click="skipFinding(f.id)"
                                class="px-3 py-1.5 text-xs rounded-md bg-slate-200 hover:bg-slate-300">Skip</button>
                      </div>
                    </template>
                    <span x-show="f.status !== 'pending'"
                          class="text-xs text-slate-400" x-text="f.status"></span>
                    <span class="text-xs text-slate-400 ml-auto"
                          x-text="f.file ? (f.file + ':' + f.line) : ''"></span>
                  </div>
                </div>

                <!-- Technical view: the original card, unchanged. -->
                <details x-show="findingView === 'technical'"
                         class="rounded-md border mb-1" :class="'sev-' + f.severity">
                  <summary class="cursor-pointer px-3 py-2 flex items-center justify-between gap-2">
                    <div class="flex-1 min-w-0">
                      <span class="font-medium" x-text="f.title"></span>
                      <span class="text-xs opacity-70 ml-2" x-text="f.file ? (f.file + ':' + f.line) : ''"></span>
                    </div>
                    <span class="text-xs font-mono px-1.5 py-0.5 rounded bg-white/60" x-text="f.status"></span>
                  </summary>
                  <div class="px-3 pb-3 pt-1 text-sm bg-white/50 space-y-2">
                    <div x-text="f.message"></div>
                    <div x-show="f.code_snippet">
                      <div class="text-xs font-semibold mt-2">Code</div>
                      <pre class="snippet" x-text="f.code_snippet"></pre>
                    </div>
                    <div x-show="f.blast_radius">
                      <span class="text-xs font-semibold">Blast radius:</span>
                      <span x-text="f.blast_radius"></span>
                    </div>
                    <div x-show="f.confidence">
                      <span class="text-xs font-semibold">Confidence:</span>
                      <span x-text="f.confidence"></span>
                    </div>
                    <div x-show="f.fix">
                      <div class="text-xs font-semibold mt-2">Suggested fix</div>
                      <pre class="snippet" x-text="f.fix"></pre>
                    </div>
                    <div class="flex gap-2 pt-2" x-show="f.status === 'pending'">
                      <button @click="postFinding(f.id)"
                              class="px-2 py-1 text-xs rounded bg-slate-900 text-white hover:bg-slate-700">Post</button>
                      <button @click="skipFinding(f.id)"
                              class="px-2 py-1 text-xs rounded bg-slate-200 hover:bg-slate-300">Skip</button>
                    </div>
                  </div>
                </details>

                </div>
              </template>
            </div>
          </template>
          <div x-show="head.findings.length === 0 && head.status === 'queued'" class="text-slate-400 italic text-sm">
            Queued — no review has run yet. Click <b>Review</b> to start.
          </div>
          <div x-show="head.findings.length === 0 && head.status === 'reviewing'" class="text-slate-500 italic text-sm flex items-center gap-2">
            <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" opacity=".25"/>
              <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="2"/>
            </svg>
            Review in progress — Claude is analysing the PR.
          </div>
          <div x-show="head.findings.length === 0 && head.status === 'awaiting_user'" class="text-slate-400 italic text-sm">
            Review complete. No findings — safe to approve.
          </div>
          <div x-show="head.findings.length === 0 && head.status === 'review_failed'" class="text-red-600 text-sm">
            Review failed. Click <b>Review</b> to retry, or check the server log.
          </div>
        </div>
      </div>
    </template>
    <template x-if="heads.length === 0">
      <div class="bg-white rounded-xl border border-dashed p-6 text-slate-400 text-sm">
        Queue is empty. Waiting for the next watcher cycle.
      </div>
    </template>
    </div>
  </section>

  <!-- Pending author action -->
  <section x-show="tab === 'queue'">
    <h2 class="text-sm font-semibold uppercase text-slate-500 mb-2">
      Pending author action
      <span class="text-slate-400">(<span x-text="awaiting_author.length"></span>)</span>
    </h2>
    <div class="space-y-2">
      <template x-for="p in awaiting_author" :key="p.number">
        <div class="bg-white border rounded-lg p-3 flex items-center justify-between"
             :class="p.has_new_activity ? 'border-amber-400 bg-amber-50' : ''">
          <div>
            <a :href="p.url" target="_blank" class="font-medium hover:underline">
              #<span x-text="p.number"></span> · <span x-text="p.title"></span>
            </a>
            <div class="text-xs text-slate-500">
              by <span x-text="p.author"></span> ·
              <span x-text="p.findings.filter(f => f.status === 'posted').length"></span> posted
              · updated <span x-text="timeAgo(p.updated_at)"></span>
              <span x-show="p.has_new_activity" class="ml-2 text-amber-700 font-semibold">RECENT CHANGES</span>
            </div>
          </div>
          <div class="flex gap-2 shrink-0">
            <button @click="approve(p.number)"
                    class="px-3 py-1 rounded bg-emerald-600 text-white text-xs hover:bg-emerald-700">Approve</button>
            <button @click="approveIfAddressed(p.number)"
                    :disabled="checkingAddressed"
                    class="px-3 py-1 rounded bg-emerald-100 border border-emerald-300 text-emerald-800 text-xs hover:bg-emerald-200 disabled:opacity-60"
                    :class="checkingAddressed ? 'cursor-wait' : ''"
                    title="Run a Claude check on each of your inline comments. Approves only if all are addressed/explained/minor.">
              <span x-show="!checkingAddressed">Approve if addressed</span>
              <span x-show="checkingAddressed">Checking…</span>
            </button>
            <button @click="dismiss(p.number)"
                    class="px-3 py-1 rounded bg-slate-200 text-xs hover:bg-slate-300">Dismiss</button>
          </div>
        </div>
      </template>
      <div x-show="awaiting_author.length === 0" class="text-slate-400 italic text-sm">
        Nothing waiting on authors.
      </div>
    </div>
  </section>

  <!-- Pending review (queue) -->
  <section x-show="tab === 'queue'">
    <div class="flex items-baseline justify-between mb-2 gap-3">
      <h2 class="text-sm font-semibold uppercase text-slate-500">
        Pending review
        <span class="text-slate-400">(<span x-text="filteredPendingReview.length"></span><span x-show="authorFilter">/<span x-text="pending_review.length"></span></span>)</span>
      </h2>
      <div class="flex items-center gap-2">
        <select x-model="authorFilter"
                class="text-xs border rounded px-2 py-1 bg-white">
          <option value="">All authors</option>
          <template x-for="a in pendingAuthors" :key="a.login">
            <option :value="a.login" x-text="a.login + ' (' + a.count + ')'"></option>
          </template>
        </select>
        <button x-show="authorFilter"
                @click="authorFilter = ''"
                class="text-xs text-slate-500 hover:text-slate-700 underline">
          clear
        </button>
      </div>
    </div>
    <div class="space-y-2">
      <template x-for="p in filteredPendingReview" :key="p.number">
        <div class="bg-white border rounded-lg p-3 flex items-center justify-between"
             :class="p.parked ? 'border-slate-300 bg-slate-50' : ''">
          <div class="min-w-0">
            <a :href="p.url" target="_blank" class="font-medium hover:underline">
              #<span x-text="p.number"></span> · <span x-text="p.title"></span>
            </a>
            <div class="text-xs text-slate-500">
              by <span x-text="p.author"></span> ·
              <span class="font-mono" x-text="p.status"></span>
              · opened <span x-text="timeAgo(p.created_at)"
                            :class="ageDays(p.created_at) >= 3 ? 'text-amber-700 font-semibold' : ''"></span>
              <span x-show="p.findings.length > 0">
                · <span x-text="p.findings.length"></span> findings
                (<span x-text="p.findings.filter(f => f.status === 'posted').length"></span> posted,
                <span x-text="p.pending_findings"></span> pending)
              </span>
              <span x-show="p.parked" class="ml-2 text-slate-500 italic">parked</span>
            </div>
          </div>
          <div class="flex gap-2 shrink-0">
            <button @click="promote(p.number)"
                    class="px-3 py-1 rounded bg-slate-900 text-white text-xs hover:bg-slate-700"
                    title="Add this PR to the head list (alongside any already-pinned PRs)">
              Add to head
            </button>
            <button @click="dismiss(p.number)"
                    class="px-3 py-1 rounded bg-slate-200 text-xs hover:bg-slate-300">
              Dismiss
            </button>
          </div>
        </div>
      </template>
      <div x-show="pending_review.length === 0" class="text-slate-400 italic text-sm">
        Nothing else queued.
      </div>
      <div x-show="pending_review.length > 0 && filteredPendingReview.length === 0"
           class="text-slate-400 italic text-sm">
        No PRs by that author.
      </div>
    </div>
  </section>

  <!-- My PRs -->
  <section x-show="tab === 'mine'" class="space-y-6">
    <div class="flex items-center justify-between">
      <div class="text-sm text-slate-500">
        Your open PRs, sorted by what each one needs from you.
      </div>
      <button @click="loadMyTriage()" :disabled="myTriageLoading"
              class="px-3 py-1.5 rounded-md bg-white border border-slate-300 text-xs hover:bg-slate-50 disabled:opacity-60">
        <span x-show="!myTriageLoading">Refresh</span>
        <span x-show="myTriageLoading">Checking…</span>
      </button>
    </div>

    <div x-show="myTriageError" class="text-sm text-red-600" x-text="myTriageError"></div>
    <div x-show="!myTriageLoading && !myTriageError && myTriage.length === 0"
         class="text-slate-400 italic text-sm">No open PRs of your own.</div>

    <template x-for="bucket in BUCKETS" :key="bucket.key">
      <div x-show="inBucket(bucket.key).length > 0">
        <h2 class="text-sm font-semibold uppercase mb-1" :class="bucket.tone" x-text="bucket.label"></h2>
        <p class="text-xs text-slate-500 mb-2" x-text="bucket.blurb"></p>

        <div class="space-y-3">
          <template x-for="pr in inBucket(bucket.key)" :key="pr.number">
            <div class="bg-white border rounded-xl" :class="bucket.ring">

              <!-- Header: what this PR is and what it needs, on two lines -->
              <div class="p-4">
                <div class="flex items-start justify-between gap-3">
                  <div class="min-w-0">
                    <a :href="pr.url" class="font-medium text-slate-900 hover:underline"
                       x-text="'#' + pr.number + ' · ' + pr.title"></a>
                    <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1">
                      <template x-for="chip in statusChips(pr)" :key="chip.text">
                        <span class="text-xs px-2 py-0.5 rounded-full border"
                              :class="chip.tone" x-text="chip.text"></span>
                      </template>
                    </div>
                  </div>
                  <div class="flex shrink-0 gap-2">
                    <button x-show="bucket.key === 'ready'" @click="mergeMyPr(pr.number)"
                            :disabled="pr.merging"
                            class="px-3 py-1.5 text-xs rounded-md bg-emerald-600 text-white hover:bg-emerald-700 disabled:opacity-60">
                      <span x-show="!pr.merging">Merge</span>
                      <span x-show="pr.merging">Merging…</span>
                    </button>
                    <button x-show="bucket.key === 'comments' && !pr.threads.some(t => t.analysis)"
                            @click="triagePr(pr.number)" :disabled="triaging === pr.number"
                            class="px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700 disabled:opacity-60">
                      <span x-show="triaging !== pr.number">Work out what to do</span>
                      <span x-show="triaging === pr.number">Reading…</span>
                    </button>
                    <button x-show="(bucket.key === 'push' || (bucket.key === 'waiting' && daysSince(pr.waiting_since) >= 3)) && !pr.review_request"
                            @click="draftRequest(pr.number)" :disabled="drafting === pr.number"
                            class="px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700 disabled:opacity-60">
                      <span x-text="drafting === pr.number ? 'Writing…' : 'Draft a review request'"></span>
                    </button>
                  </div>
                </div>
                <div x-show="pr.merge_error" class="mt-2 text-xs text-red-600" x-text="pr.merge_error"></div>
              </div>

              <!-- Review request: one line until you want it -->
              <template x-if="pr.review_request">
                <div class="border-t border-slate-100 px-4 py-3">
                  <div class="flex items-center justify-between gap-2">
                    <div class="text-sm text-slate-700">
                      Review request ready
                      <span x-show="pr.review_request.status === 'sent'" class="text-slate-400">· sent</span>
                    </div>
                    <div class="flex gap-2">
                      <button @click="copyText(requestText(pr.review_request), 'req-' + pr.number)"
                              class="px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700">
                        <span x-text="copied === ('req-' + pr.number) ? 'Copied' : 'Copy for Teams'"></span>
                      </button>
                      <button x-show="teamsConfigured"
                              @click="sendRequest(pr.number, pr.review_request)"
                              :disabled="sending === pr.number"
                              class="px-3 py-1.5 text-xs rounded-md bg-white border border-slate-300 hover:bg-slate-50 disabled:opacity-60">
                        <span x-text="sending === pr.number ? 'Posting…' : 'Post to ' + teamsChannel"></span>
                      </button>
                      <button @click="openRequest = openRequest === pr.number ? null : pr.number"
                              class="px-3 py-1.5 text-xs rounded-md bg-white border border-slate-300 hover:bg-slate-50">
                        <span x-text="openRequest === pr.number ? 'Hide' : 'Edit'"></span>
                      </button>
                    </div>
                  </div>

                  <div x-show="openRequest === pr.number" class="mt-2">
                    <div class="text-xs text-slate-500 mb-1">Context line</div>
                    <textarea x-model="pr.review_request.summary" rows="3"
                              class="w-full text-sm px-3 py-2 rounded-md border border-slate-300"></textarea>
                    <div class="mt-2 text-xs text-slate-500 mb-1">How it lands in the channel</div>
                    <div @click="selectAll($el)" title="Click to select all"
                         class="text-sm bg-slate-50 rounded-md p-3 border border-slate-200 cursor-text">
                      <div class="text-slate-800" x-text="pr.review_request.summary"></div>
                      <div class="mt-2 text-slate-900" x-text="pr.review_request.title"></div>
                      <div class="text-blue-700 break-all" x-text="pr.review_request.url"></div>
                    </div>
                    <div class="flex gap-2 mt-2">
                      <button @click="draftRequest(pr.number)" :disabled="drafting === pr.number"
                              class="px-3 py-1.5 text-xs rounded-md bg-white border border-slate-300 hover:bg-slate-50 disabled:opacity-60">
                        <span x-text="drafting === pr.number ? 'Rewriting…' : 'Rewrite it'"></span>
                      </button>
                    </div>
                    <div x-show="!teamsConfigured" class="text-xs text-slate-500 mt-2">
                      No Teams webhook set up, so there is nothing to post to. Add a Workflows
                      webhook on the Squad Arete channel and put the URL in
                      <code class="bg-slate-100 px-1 rounded">~/.pr-watcher/config.json</code>
                      as <code class="bg-slate-100 px-1 rounded">teams_webhook_url</code>.
                    </div>
                  </div>
                </div>
              </template>

              <!-- The decisions, collected -->
              <div x-show="pr.decided_count > 0" class="border-t border-slate-100 px-4 py-3">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                  <div class="text-sm text-slate-700">
                    <span x-text="pr.decided_count"></span> decided
                    <span x-show="pr.threads.length - pr.decided_count > 0" class="text-slate-400">
                      · <span x-text="pr.threads.length - pr.decided_count"></span> to go
                    </span>
                  </div>
                  <div class="flex gap-2">
                    <button @click="copyText(summaryText(pr), 'sum-' + pr.number)"
                            class="px-3 py-1.5 text-xs rounded-md bg-emerald-700 text-white hover:bg-emerald-800">
                      <span x-text="copied === ('sum-' + pr.number) ? 'Copied' : 'Copy the whole lot'"></span>
                    </button>
                    <button @click="showSummary = showSummary === pr.number ? null : pr.number"
                            class="px-3 py-1.5 text-xs rounded-md bg-white border border-slate-300 hover:bg-slate-50">
                      <span x-text="showSummary === pr.number ? 'Hide' : 'See it'"></span>
                    </button>
                    <button @click="saveBundleHandoff(pr.number)"
                            :disabled="handingOff === 'bundle-' + pr.number"
                            class="px-3 py-1.5 text-xs rounded-md bg-white border border-slate-300 hover:bg-slate-50 disabled:opacity-60">
                      <span x-text="handingOff === ('bundle-' + pr.number) ? 'Saving…' : 'Save as a file'"></span>
                    </button>
                  </div>
                </div>

                <div x-show="showSummary === pr.number" class="mt-2">
                  <pre @click="selectAll($el)" title="Click to select all"
                       class="text-xs text-slate-800 whitespace-pre-wrap max-h-72 overflow-y-auto bg-slate-50 rounded p-3 border border-slate-200 cursor-text"
                       x-text="summaryText(pr)"></pre>
                </div>

                <div x-show="pr.bundle && pr.bundle.handoff_path" class="mt-2">
                  <div class="text-xs text-slate-500 mb-1">
                    Saved. Paste this into Claude Code in your learnamp checkout:
                  </div>
                  <pre @click="selectAll($el)" title="Click to select all"
                       class="text-xs text-slate-800 whitespace-pre-wrap bg-slate-50 rounded p-2 border border-slate-200 cursor-text"
                       x-text="'Read ' + (pr.bundle && pr.bundle.handoff_path) + ' and work through it.'"></pre>
                </div>
              </div>

              <!-- Comments: one scannable row each, opened one at a time -->
              <div x-show="pr.threads.length > 0" class="border-t border-slate-100">
                <div class="px-4 pt-3 pb-1 text-xs font-semibold uppercase tracking-wide text-slate-500">
                  Waiting on you
                </div>

                <template x-for="t in pr.threads" :key="t.root_id">
                  <div x-show="!t.analysis || t.analysis.status === 'pending'
                               || t.analysis.status === 'handed_off'"
                       class="border-t border-slate-100 first:border-t-0">

                    <!-- Collapsed row -->
                    <button @click="openThread = openThread === t.root_id ? null : t.root_id"
                            class="w-full text-left px-4 py-3 hover:bg-slate-50 flex items-start gap-3">
                      <span class="shrink-0 mt-0.5 text-xs px-2 py-0.5 rounded-full border font-medium"
                            :class="actionClass(t.analysis && t.analysis.action)"
                            x-text="actionLabel(t.analysis && t.analysis.action)"></span>
                      <span class="flex-1 min-w-0">
                        <span class="block text-sm font-medium text-slate-900"
                              x-text="threadHeadline(t)"></span>
                        <span class="block text-xs text-slate-500 mt-0.5">
                          <span x-text="t.author"></span>
                          <span x-show="t.path" x-text="' · ' + t.path + ':' + t.line"></span>
                          <span x-show="t.refinement && t.refinement.instruction"
                                class="text-emerald-700"> · decided</span>
                          <span x-show="t.analysis && t.analysis.status === 'handed_off'"
                                class="text-amber-700"> · with Claude, not told yet</span>
                        </span>
                      </span>
                      <span class="shrink-0 text-slate-400 text-xs mt-1"
                            x-text="openThread === t.root_id ? '▲' : '▼'"></span>
                    </button>

                    <!-- Expanded -->
                    <div x-show="openThread === t.root_id" class="px-4 pb-4">

                      <div x-show="!t.analysis" class="text-sm text-slate-700 whitespace-pre-wrap
                                  bg-slate-50 rounded-md p-3 border border-slate-200 max-h-48 overflow-y-auto"
                           x-text="t.body"></div>

                      <template x-if="t.analysis">
                        <div>
                          <div x-show="threadWants(t).length" class="mb-3">
                            <div class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1.5">
                              What they want
                            </div>
                            <ul class="space-y-1">
                              <template x-for="(w, wi) in threadWants(t)" :key="wi">
                                <li class="text-sm text-slate-800 flex gap-2">
                                  <span class="text-slate-400">•</span><span x-text="w"></span>
                                </li>
                              </template>
                            </ul>
                          </div>

                          <div x-show="t.analysis.their_case" class="mb-3">
                            <div class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1.5">
                              Why they'd say that
                            </div>
                            <p class="text-sm text-slate-700 leading-relaxed" x-text="t.analysis.their_case"></p>
                          </div>

                          <div class="mb-3">
                            <div class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1.5">
                              What I would do
                            </div>
                            <p class="text-sm text-slate-800 leading-relaxed" x-text="t.analysis.recommendation"></p>
                          </div>

                          <div x-show="t.analysis.unknowns"
                               class="mb-3 rounded-md border border-slate-200 bg-slate-50 px-3 py-2">
                            <div class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">
                              What I couldn't check
                            </div>
                            <p class="text-sm text-slate-700 leading-relaxed" x-text="t.analysis.unknowns"></p>
                          </div>

                          <details class="mb-3">
                            <summary class="text-xs text-slate-500 cursor-pointer hover:text-slate-700">
                              The longer version
                            </summary>
                            <p class="text-sm text-slate-700 leading-relaxed mt-2" x-text="t.analysis.summary"></p>
                            <div class="mt-2">
                              <div class="text-xs text-slate-500 mb-1">What they actually wrote</div>
                              <div class="text-sm text-slate-700 whitespace-pre-wrap bg-slate-50 rounded-md p-3 border border-slate-200 max-h-48 overflow-y-auto"
                                   x-text="t.body"></div>
                            </div>
                          </details>

                          <!-- Actions come after the reading, never before -->
                          <div class="pt-3 border-t border-slate-100">
                            <div class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-2">
                              What now
                            </div>
                            <div class="flex flex-wrap gap-2">
                              <button x-show="t.analysis.reply_draft"
                                      @click="openAction = openAction === ('reply-' + t.root_id) ? null : ('reply-' + t.root_id)"
                                      class="px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700">
                                Reply to them
                              </button>
                              <button @click="toggleRefine(pr.number, t); openAction = openAction === ('refine-' + t.root_id) ? null : ('refine-' + t.root_id)"
                                      class="px-3 py-1.5 text-xs rounded-md bg-white border border-slate-400 text-slate-800 hover:bg-slate-50">
                                Take part of it
                              </button>
                              <button x-show="t.analysis.fix_prompt"
                                      @click="openAction = openAction === ('fix-' + t.root_id) ? null : ('fix-' + t.root_id)"
                                      class="px-3 py-1.5 text-xs rounded-md bg-white border border-slate-300 hover:bg-slate-50">
                                Just do what they asked
                              </button>
                              <button @click="toggleThreadChat(pr.number, t)"
                                      class="px-3 py-1.5 text-xs rounded-md bg-white border border-slate-300 hover:bg-slate-50">
                                Talk it through
                              </button>
                              <button @click="skipThread(pr.number, t)"
                                      class="px-3 py-1.5 text-xs rounded-md bg-slate-100 hover:bg-slate-200">
                                <span x-text="t.analysis.action === 'no_action' ? 'Nothing to do' : 'Skip'"></span>
                              </button>
                            </div>

                            <!-- Reply -->
                            <div x-show="openAction === ('reply-' + t.root_id)" class="mt-3">
                              <div class="text-xs text-slate-500 mb-1">How it will look to them</div>
                              <div class="text-sm text-slate-800 bg-slate-50 rounded-md p-3 border border-slate-200 mb-2"
                                   x-html="renderMd(t.analysis.reply_draft)"></div>
                              <div class="text-xs text-slate-500 mb-1">Edit it</div>
                              <textarea x-model="t.analysis.reply_draft" rows="7"
                                        class="w-full text-sm px-3 py-2 rounded-md border border-slate-300 font-mono"></textarea>
                              <button @click="sendThreadReply(pr.number, t)"
                                      :disabled="replying === t.root_id"
                                      class="mt-2 px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700 disabled:opacity-60">
                                <span x-text="replying === t.root_id ? 'Sending…' : 'Send it'"></span>
                              </button>
                            </div>

                            <!-- Do exactly what they asked -->
                            <div x-show="openAction === ('fix-' + t.root_id)" class="mt-3">
                              <div class="text-xs text-slate-500 mb-1">
                                Hand this to Claude in
                                <code class="bg-slate-100 px-1 rounded" x-text="repoDir || 'your checkout'"></code>
                              </div>
                              <pre @click="selectAll($el)" title="Click to select all"
                                   class="text-xs text-slate-800 whitespace-pre-wrap max-h-48 overflow-y-auto bg-slate-50 rounded p-2 border border-slate-200 cursor-text"
                                   x-text="t.analysis.fix_prompt"></pre>
                              <button @click="copyText(t.analysis.fix_prompt, 'fix-' + t.root_id); markHandedOff(pr.number, t)"
                                      class="mt-2 px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700">
                                <span x-text="copied === ('fix-' + t.root_id) ? 'Copied' : 'Copy it'"></span>
                              </button>

                              <!-- Copying is not the end of it. The reviewer still
                                   has to be told, and that is what closes the thread. -->
                              <div x-show="t.analysis.status === 'handed_off'"
                                   class="mt-3 pt-3 border-t border-slate-200">
                                <div class="text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">
                                  Now tell them
                                </div>
                                <p class="text-xs text-slate-500 mb-2">
                                  They do not know you are doing this yet. Sending the note below
                                  closes the thread; Skip would mean you had decided against it.
                                </p>
                                <div x-show="t.analysis.reply_draft"
                                     class="text-sm text-slate-800 bg-white rounded-md p-3 border border-slate-200 mb-2"
                                     x-html="renderMd(t.analysis.reply_draft)"></div>
                                <textarea x-model="t.analysis.reply_draft" rows="4"
                                          class="w-full text-sm px-3 py-2 rounded-md border border-slate-300 font-mono mb-2"></textarea>
                                <button @click="sendThreadReply(pr.number, t)"
                                        :disabled="replying === t.root_id"
                                        class="px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700 disabled:opacity-60">
                                  <span x-text="replying === t.root_id ? 'Sending…' : 'Send it and close this off'"></span>
                                </button>
                              </div>
                            </div>

                            <!-- Take part of it -->
                            <div x-show="openAction === ('refine-' + t.root_id)" class="mt-3">
                              <div class="text-xs text-slate-500 mb-2">
                                Say which bits you are taking and which you are not. Your own words,
                                no need to be tidy.
                              </div>
                              <textarea x-model="refineNote" rows="3"
                                        placeholder="Fair point about the controller so I'll split that out, but I'm not renaming the route."
                                        class="w-full text-sm px-3 py-2 rounded-md border border-slate-300 mb-2"></textarea>
                              <button @click="runRefine(pr.number, t)"
                                      :disabled="refining || !refineNote.trim()"
                                      class="px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700 disabled:opacity-50">
                                <span x-text="refining ? 'Working it up…' : 'Turn it into an instruction'"></span>
                              </button>

                              <template x-if="t.refinement && t.refinement.instruction">
                                <div class="mt-3 space-y-2">
                                  <div x-show="refineNotes" class="rounded-md border border-slate-200 bg-slate-50 p-2">
                                    <div class="text-xs text-slate-500 mb-1">Worth knowing</div>
                                    <div class="text-sm text-slate-700" x-html="renderMd(refineNotes)"></div>
                                  </div>
                                  <pre @click="selectAll($el)" title="Click to select all"
                                       class="text-xs text-slate-800 whitespace-pre-wrap max-h-48 overflow-y-auto bg-slate-50 rounded p-2 border border-slate-200 cursor-text"
                                       x-text="t.refinement.instruction"></pre>
                                  <div class="flex flex-wrap gap-2">
                                    <button @click="copyText(t.refinement.instruction, 'ref-' + t.root_id)"
                                            class="px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700">
                                      <span x-text="copied === ('ref-' + t.root_id) ? 'Copied' : 'Copy it'"></span>
                                    </button>
                                    <button x-show="t.refinement.reply_draft"
                                            @click="sendThreadReplyBody(pr.number, t, t.refinement.reply_draft, 'refrep-' + t.root_id)"
                                            :disabled="replying !== null"
                                            class="px-3 py-1.5 text-xs rounded-md bg-white border border-slate-300 hover:bg-slate-50 disabled:opacity-50">
                                      <span x-text="replying === ('refrep-' + t.root_id) ? 'Sending…' : 'Send them the reply'"></span>
                                    </button>
                                  </div>
                                </div>
                              </template>
                            </div>

                            <!-- Clarifier -->
                            <div x-show="threadChatFor === t.root_id"
                                 class="mt-3 rounded-lg border border-slate-300 bg-slate-50 p-3">
                              <div class="flex items-center justify-between mb-2">
                                <div class="text-xs font-medium text-slate-700">Talking it through</div>
                                <button @click="resetThreadChat()"
                                        class="text-xs text-slate-500 hover:text-slate-800 underline">Start over</button>
                              </div>
                              <div class="space-y-2 mb-2">
                                <template x-for="(m, mi) in threadChatMessages" :key="mi">
                                  <div>
                                    <div x-show="m.role === 'user'" class="flex justify-end">
                                      <div class="max-w-[85%] rounded-lg bg-slate-900 text-white px-3 py-2 text-sm whitespace-pre-wrap"
                                           x-text="m.content"></div>
                                    </div>
                                    <div x-show="m.role === 'assistant'" class="space-y-2">
                                      <template x-for="(part, pi) in clarifierParts(m.content)" :key="pi">
                                        <div>
                                          <div x-show="part.type === 'text'"
                                               class="rounded-lg bg-white border border-slate-200 px-3 py-2 text-sm text-slate-800 leading-relaxed"
                                               x-html="renderMd(part.body)"></div>
                                          <div x-show="part.type === 'reply'"
                                               class="rounded-lg border border-blue-200 bg-blue-50 px-3 py-2">
                                            <div class="text-xs text-blue-800 font-medium mb-1">Reply to send</div>
                                            <div class="text-sm text-slate-800 whitespace-pre-wrap" x-text="part.body"></div>
                                            <button @click="sendThreadReplyBody(pr.number, t, part.body, mi + '-' + pi)"
                                                    :disabled="replying !== null"
                                                    class="mt-2 px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700 disabled:opacity-50">
                                              <span x-text="replying === (mi + '-' + pi) ? 'Sending…' : 'Send this'"></span>
                                            </button>
                                          </div>
                                          <div x-show="part.type === 'fix'"
                                               class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2">
                                            <div class="text-xs text-amber-900 font-medium mb-1">Instruction for Claude</div>
                                            <pre @click="selectAll($el)" title="Click to select all"
                                                 class="text-xs text-slate-800 whitespace-pre-wrap max-h-40 overflow-y-auto bg-white rounded p-2 border border-amber-100 cursor-text"
                                                 x-text="part.body"></pre>
                                            <button @click="copyText(part.body, 'cfix-' + mi + '-' + pi)"
                                                    class="mt-2 px-3 py-1.5 text-xs rounded-md bg-slate-900 text-white hover:bg-slate-700">
                                              <span x-text="copied === ('cfix-' + mi + '-' + pi) ? 'Copied' : 'Copy it'"></span>
                                            </button>
                                          </div>
                                        </div>
                                      </template>
                                    </div>
                                  </div>
                                </template>
                              </div>
                              <div x-show="threadChatBusy" class="text-xs text-slate-500 mb-2">Claude is reading the PR…</div>
                              <div class="flex gap-2">
                                <input x-model="threadChatInput" @keydown.enter="sendThreadChat()"
                                       :disabled="threadChatBusy"
                                       placeholder="I think they are right — what would changing it involve?"
                                       class="flex-1 px-3 py-2 text-sm rounded-md border border-slate-300 disabled:bg-slate-100" />
                                <button @click="sendThreadChat()" :disabled="threadChatBusy"
                                        class="px-4 py-2 text-sm rounded-md bg-slate-900 text-white hover:bg-slate-700 disabled:opacity-50">
                                  Send
                                </button>
                              </div>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </section>

  <!-- Activity -->
  <section x-show="tab === 'queue'">
    <h2 class="text-sm font-semibold uppercase text-slate-500 mb-2">Recent activity</h2>
    <ul class="bg-white rounded-lg border divide-y text-sm">
      <template x-for="a in activity" :key="a.id">
        <li class="px-3 py-1.5 flex justify-between text-xs">
          <span>
            <template x-if="a.pr_number">
              <a :href="'https://github.com/' + repo + '/pull/' + a.pr_number"
                 target="_blank" rel="noopener noreferrer"
                 class="font-mono text-blue-600 hover:underline"
                 x-text="'#' + a.pr_number"></a>
            </template>
            <template x-if="!a.pr_number">
              <span class="font-mono text-slate-500">—</span>
            </template>
            <span class="ml-2 font-semibold" x-text="a.action"></span>
            <span class="ml-2 text-slate-500" x-text="a.details"></span>
          </span>
          <span class="text-slate-400" x-text="fmtTime(a.created_at)"></span>
        </li>
      </template>
      <li x-show="activity.length === 0" class="px-3 py-2 text-slate-400 italic">No activity yet.</li>
    </ul>
  </section>
</main>

  <!-- My open PRs (follow-up sidebar) -->
  <aside class="w-80 shrink-0">
    <div class="flex items-baseline justify-between mb-2">
      <h2 class="text-sm font-semibold uppercase text-slate-500">
        My open PRs
        <span class="text-slate-400">(<span x-text="myPrs.length"></span>)</span>
      </h2>
      <div class="text-xs text-slate-400" x-show="myPrsError" x-text="'gh error'" :title="myPrsError"></div>
    </div>
    <div class="space-y-2">
      <template x-for="p in myPrs" :key="p.number">
        <a :href="p.url" target="_blank" rel="noopener noreferrer"
           class="block bg-white border rounded-lg p-3 hover:bg-slate-50">
          <div class="text-sm font-medium leading-snug">
            #<span x-text="p.number"></span> · <span x-text="p.title"></span>
          </div>
          <div class="mt-2 flex items-center gap-2 flex-wrap">
            <span class="text-xs font-semibold px-1.5 py-0.5 rounded"
                  :class="reviewBadgeClass(p)"
                  x-text="reviewBadgeLabel(p)"></span>
            <span x-show="p.approvals > 0" class="text-xs text-emerald-700"
                  x-text="'👍 ' + p.approvals"></span>
            <span x-show="p.changes_requested > 0" class="text-xs text-red-700"
                  x-text="'✋ ' + p.changes_requested"></span>
            <span x-show="p.is_draft" class="text-xs text-slate-400 italic">draft</span>
          </div>
          <div class="mt-2 flex items-center gap-2" x-show="p.review_decision === 'APPROVED'">
            <button @click.prevent.stop="mergePr(p.number)"
                    :disabled="p.merging"
                    class="px-2 py-1 text-xs rounded bg-emerald-600 text-white hover:bg-emerald-700 disabled:opacity-60"
                    :class="p.merging ? 'cursor-wait' : ''"
                    title="Merge this PR (squash + delete branch, or your configured merge skill). Pre-flight blockers still stop the merge.">
              <span x-show="!p.merging">Merge</span>
              <span x-show="p.merging">Merging…</span>
            </button>
          </div>
          <div x-show="p.merge_error"
               class="mt-1 text-xs text-red-700 whitespace-pre-wrap break-words"
               x-text="p.merge_error"></div>
        </a>
      </template>
      <div x-show="myPrs.length === 0 && !myPrsError" class="text-slate-400 italic text-sm">
        No open PRs.
      </div>
    </div>
  </aside>

</div>
</div>

<script>
function app() {
  return {
    heads: [],
    pending_review: [],
    awaiting_author: [],
    watchers: [],
    activity: [],
    lastRefresh: '—',
    authorFilter: '',
    fetching: false,
    checkingAddressed: false,
    repo: '',
    myPrs: [],
    myPrsError: '',
    // 'plain' | 'technical'. Plain English is the default view; the choice
    // sticks across reloads so the user sets it once.
    findingView: localStorage.getItem('prw_finding_view') || 'plain',

    setFindingView(v) {
      this.findingView = v;
      localStorage.setItem('prw_finding_view', v);
    },

    // Findings reviewed before the plain-English layer existed have no
    // plain_* fields. Fall back to the technical text rather than a blank card.
    // Number findings across the whole PR, not per severity group — the plain
    // view hides the severity headings, so per-group numbering would restart
    // with no visible reason.
    plainIndex(head, f) {
      const order = ['critical', 'important', 'suggestion', 'nit'];
      const all = [...head.findings].sort(
        (a, b) => order.indexOf(a.severity) - order.indexOf(b.severity) || a.id - b.id
      );
      return all.findIndex(x => x.id === f.id) + 1;
    },
    // ---- My own PRs ---------------------------------------------------
    tab: 'queue',
    myTriage: [],
    myTriageLoading: false,
    myTriageError: '',
    triaging: null,
    drafting: null,
    sending: null,
    teamsConfigured: false,
    teamsChannel: 'Teams',
    replying: null,
    copied: null,
    repoDir: '',

    // Order matters: this is the order the buckets are read in, most
    // actionable first. `not_ready` is last because the ball is with the user
    // in a way no button here can help with.
    BUCKETS: [
      { key: 'ready', label: 'Ready to go',
        blurb: 'Approved, checks passing, nothing outstanding.',
        tone: 'text-emerald-700', ring: 'border-emerald-200' },
      { key: 'comments', label: 'Review comments',
        blurb: 'Someone is waiting on a reply from you.',
        tone: 'text-amber-700', ring: 'border-amber-200' },
      { key: 'waiting', label: 'Waiting on them',
        blurb: 'You have answered everything. It is with the reviewer now.',
        tone: 'text-slate-600', ring: 'border-slate-200' },
      { key: 'push', label: 'Push for a review',
        blurb: 'Nobody has looked at it yet.',
        tone: 'text-blue-700', ring: 'border-blue-200' },
      { key: 'not_ready', label: 'Not ready yet',
        blurb: 'Still a draft, or the build is failing.',
        tone: 'text-slate-500', ring: 'border-slate-200' },
    ],

    inBucket(key) { return this.myTriage.filter(p => p.category === key); },

    daysSince(ts) {
      if (!ts) return null;
      const t = Date.parse(ts);
      if (isNaN(t)) return null;
      return Math.floor((Date.now() - t) / 86400000);
    },

    // Only one comment and one action open at a time. With fifteen comments on
    // a PR, everything expanded is the thing that made this unreadable.
    openThread: null,
    openAction: null,
    openRequest: null,

    // Plain-English state chips. Each says what it means for the reader rather
    // than naming the mechanism: "nobody assigned" beats "reviewDecision: ''".
    statusChips(pr) {
      const chips = [];
      const undecided = pr.threads.length - (pr.decided_count || 0);
      if (undecided > 0) {
        chips.push({ text: `${undecided} to decide`,
                     tone: 'bg-amber-50 text-amber-800 border-amber-200' });
      }
      if (pr.decided_count > 0) {
        chips.push({ text: `${pr.decided_count} decided`,
                     tone: 'bg-emerald-50 text-emerald-800 border-emerald-200' });
      }
      if (pr.is_draft) {
        chips.push({ text: 'still a draft',
                     tone: 'bg-slate-100 text-slate-600 border-slate-200' });
      }
      if (pr.checks === 'red') {
        chips.push({ text: 'build failing',
                     tone: 'bg-red-50 text-red-800 border-red-200' });
      } else if (pr.checks === 'pending') {
        chips.push({ text: 'build running',
                     tone: 'bg-slate-100 text-slate-600 border-slate-200' });
      } else if (pr.checks === 'green') {
        chips.push({ text: 'build passing',
                     tone: 'bg-slate-100 text-slate-600 border-slate-200' });
      }
      if (pr.category === 'waiting') {
        const days = this.daysSince(pr.waiting_since);
        chips.push({
          text: days === null ? 'waiting on them'
              : days === 0 ? 'answered today'
              : days === 1 ? 'waiting 1 day'
              : `waiting ${days} days`,
          tone: days !== null && days >= 3
            ? 'bg-amber-50 text-amber-800 border-amber-200'
            : 'bg-slate-100 text-slate-600 border-slate-200',
        });
      }
      if (pr.review_decision === 'APPROVED') {
        chips.push({ text: 'approved',
                     tone: 'bg-emerald-50 text-emerald-800 border-emerald-200' });
      } else if (pr.review_decision === 'CHANGES_REQUESTED') {
        chips.push({ text: 'changes requested',
                     tone: 'bg-amber-50 text-amber-800 border-amber-200' });
      } else if (!pr.is_draft) {
        chips.push({ text: 'nobody assigned',
                     tone: 'bg-blue-50 text-blue-800 border-blue-200' });
      }
      return chips;
    },

    // Threads triaged before headlines existed fall back to the first sentence
    // of the summary rather than showing a blank row.
    threadHeadline(t) {
      if (t.analysis && t.analysis.headline) return t.analysis.headline;
      if (t.analysis && t.analysis.summary) {
        const first = t.analysis.summary.split(/(?<=[.!?])\s/)[0] || t.analysis.summary;
        return first.length > 90 ? first.slice(0, 87) + '…' : first;
      }
      const body = (t.body || '').replace(/\s+/g, ' ').trim();
      return body.length > 90 ? body.slice(0, 87) + '…' : (body || 'A comment');
    },

    threadWants(t) {
      if (!t.analysis || !t.analysis.wants) return [];
      try {
        const w = JSON.parse(t.analysis.wants);
        return Array.isArray(w) ? w : [];
      } catch (e) { return []; }
    },

    actionLabel(a) {
      return { code_fix: 'Needs a change', reply: 'Needs an answer',
               unsure: 'Your call', no_action: 'Already handled' }[a] || 'Unclear';
    },
    actionClass(a) {
      return {
        code_fix: 'bg-amber-100 text-amber-800 border-amber-200',
        reply: 'bg-blue-100 text-blue-800 border-blue-200',
        unsure: 'bg-purple-100 text-purple-800 border-purple-200',
        no_action: 'bg-slate-100 text-slate-700 border-slate-200',
      }[a] || 'bg-slate-100 text-slate-700 border-slate-200';
    },

    async loadMyTriage() {
      this.myTriageLoading = true;
      this.myTriageError = '';
      try {
        const r = await fetch('/api/my_prs/triage');
        const data = await r.json();
        this.myTriage = data.prs || [];
        if (data.error) this.myTriageError = data.error;
      } catch (e) {
        this.myTriageError = String(e);
      } finally {
        this.myTriageLoading = false;
      }
    },

    // The message as it will land in the channel: context line, blank line,
    // title, bare link. Teams unfurls the link into a card of its own.
    requestText(r) {
      return `${r.summary}\n\n${r.title}\n${r.url}`;
    },

    async draftRequest(number) {
      this.drafting = number;
      this.myTriageError = '';
      try {
        const r = await fetch(`/api/my_prs/${number}/review_request`, { method: 'POST' });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          this.myTriageError = e.detail || `Could not draft it (${r.status})`;
        } else {
          await this.loadMyTriage();
        }
      } catch (e) {
        this.myTriageError = String(e);
      } finally {
        this.drafting = null;
      }
    },

    async sendRequest(number, req) {
      this.sending = number;
      this.myTriageError = '';
      try {
        const r = await fetch(`/api/my_prs/${number}/review_request/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ summary: req.summary }),
        });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          this.myTriageError = e.detail || `Post failed (${r.status})`;
        } else {
          req.status = 'sent';
        }
      } catch (e) {
        this.myTriageError = String(e);
      } finally {
        this.sending = null;
      }
    },

    // ---- Bundling a PR's decisions ------------------------------------
    bundling: null,
    bundleNotes: '',
    postingBundle: null,
    showSummary: null,

    // Built in the browser from data already loaded, so Copy is instant and
    // what you copy is exactly what you wrote. Mirrors assemble_summary() in
    // my_prs.py, which writes the same text to the handoff file.
    summaryText(pr) {
      const decided = pr.threads.filter(
        t => t.refinement && t.refinement.instruction
      );
      const undecided = pr.threads.filter(
        t => !(t.refinement && t.refinement.instruction)
      );
      const where = t => t.path ? `${t.path}:${t.line}` : 'PR conversation';
      const out = [
        `# PR #${pr.number} — ${pr.title}`, '',
        `Repo: ${this.repo}`,
        `PR: ${pr.url}`, '',
        `${decided.length} of ${pr.threads.length} comments decided.`, '',
      ];
      decided.forEach((t, i) => {
        out.push('---', '', `## ${i + 1}. ${t.author} on ${where(t)}`, '',
                 '**What they said**', '', (t.body || '').trim(), '',
                 '**What I decided**', '', (t.refinement.note || '').trim(), '',
                 '**Instruction**', '', (t.refinement.instruction || '').trim(), '');
        if (t.refinement.reply_draft) {
          out.push('**Reply drafted for them**', '',
                   t.refinement.reply_draft.trim(), '');
        }
      });
      if (undecided.length) {
        out.push('---', '', '## Not decided yet', '');
        undecided.forEach(t => out.push(`- ${t.author} on ${where(t)}`));
        out.push('');
      }
      return out.join('\n');
    },

    async buildBundle(number) {
      this.bundling = number;
      this.bundleNotes = '';
      this.myTriageError = '';
      try {
        const r = await fetch(`/api/my_prs/${number}/bundle`, { method: 'POST' });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          this.myTriageError = e.detail || `Could not bundle it (${r.status})`;
        } else {
          const data = await r.json();
          this.bundleNotes = data.notes || '';
          const pr = this.myTriage.find(p => p.number === number);
          if (pr) {
            pr.bundle = {
              instruction: data.instruction, reply: data.reply,
              handoff_path: null, status: 'draft',
            };
          }
        }
      } catch (e) {
        this.myTriageError = String(e);
      } finally {
        this.bundling = null;
      }
    },

    async saveBundleHandoff(number) {
      this.handingOff = 'bundle-' + number;
      this.myTriageError = '';
      try {
        const r = await fetch(`/api/my_prs/${number}/bundle/handoff`, { method: 'POST' });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          this.myTriageError = e.detail || `Could not save it (${r.status})`;
        } else {
          const pr = this.myTriage.find(p => p.number === number);
          if (pr && pr.bundle) pr.bundle.handoff_path = (await r.json()).path;
        }
      } catch (e) {
        this.myTriageError = String(e);
      } finally {
        this.handingOff = null;
      }
    },

    async postBundle(number, bundle) {
      this.postingBundle = number;
      this.myTriageError = '';
      try {
        const r = await fetch(`/api/my_prs/${number}/bundle/post`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reply: bundle.reply }),
        });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          this.myTriageError = e.detail || `Post failed (${r.status})`;
        } else {
          bundle.status = 'posted';
        }
      } catch (e) {
        this.myTriageError = String(e);
      } finally {
        this.postingBundle = null;
      }
    },

    // ---- Partial agreement --------------------------------------------
    refineFor: null,
    refineNote: '',
    refining: false,
    refineNotes: '',
    handingOff: null,

    toggleRefine(number, t) {
      if (this.refineFor === t.root_id) { this.refineFor = null; return; }
      this.refineFor = t.root_id;
      this.myTriageError = '';
      // Reopening a thread you already refined shows the note you wrote, so
      // you can adjust it rather than start from a blank box.
      this.refineNote = (t.refinement && t.refinement.note) || '';
      this.refineNotes = '';
    },

    async runRefine(number, t) {
      const note = this.refineNote.trim();
      if (!note || this.refining) return;
      this.refining = true;
      this.myTriageError = '';
      try {
        const r = await fetch(`/api/my_prs/${number}/threads/${t.root_id}/refine`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ note }),
        });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          this.myTriageError = e.detail || `Could not refine it (${r.status})`;
        } else {
          const data = await r.json();
          this.refineNotes = data.notes || '';
          // Set it locally as well as reloading, so the panel fills in even if
          // the PR has dropped out of the outstanding list in the meantime.
          t.refinement = {
            note, instruction: data.instruction,
            reply_draft: data.reply_draft, handoff_path: null,
          };
        }
      } catch (e) {
        this.myTriageError = String(e);
      } finally {
        this.refining = false;
      }
    },

    async saveHandoff(number, t) {
      this.handingOff = t.root_id;
      this.myTriageError = '';
      try {
        const r = await fetch(`/api/my_prs/${number}/threads/${t.root_id}/handoff`, {
          method: 'POST',
        });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          this.myTriageError = e.detail || `Could not save it (${r.status})`;
        } else {
          t.refinement.handoff_path = (await r.json()).path;
        }
      } catch (e) {
        this.myTriageError = String(e);
      } finally {
        this.handingOff = null;
      }
    },

    // ---- Per-comment clarifier ----------------------------------------
    threadChatFor: null,
    threadChatPr: null,
    threadChatMessages: [],
    threadChatInput: '',
    threadChatBusy: false,

    async toggleThreadChat(number, t) {
      if (this.threadChatFor === t.root_id) { this.threadChatFor = null; return; }
      this.threadChatFor = t.root_id;
      this.threadChatPr = number;
      this.threadChatMessages = [];
      this.myTriageError = '';
      const r = await fetch(`/api/my_prs/${number}/threads/${t.root_id}/chat`);
      if (r.ok) this.threadChatMessages = (await r.json()).messages;
    },

    async sendThreadChat() {
      const msg = this.threadChatInput.trim();
      if (!msg || this.threadChatBusy) return;
      const number = this.threadChatPr, tid = this.threadChatFor;
      this.threadChatInput = '';
      this.threadChatMessages.push({ role: 'user', content: msg });
      this.threadChatBusy = true;
      this.myTriageError = '';
      try {
        const r = await fetch(`/api/my_prs/${number}/threads/${tid}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg }),
        });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          this.myTriageError = e.detail || `Request failed (${r.status})`;
        } else {
          this.threadChatMessages.push({ role: 'assistant', content: (await r.json()).reply });
        }
      } catch (e) {
        this.myTriageError = String(e);
      } finally {
        this.threadChatBusy = false;
      }
    },

    async resetThreadChat() {
      await fetch(`/api/my_prs/${this.threadChatPr}/threads/${this.threadChatFor}/chat/reset`,
                  { method: 'POST' });
      this.threadChatMessages = [];
    },

    // The clarifier wraps a sendable reply in <REPLY> and a change instruction
    // in <FIX>. Split a turn into prose plus those, so each gets its own control.
    clarifierParts(content) {
      const parts = [];
      const re = /<(REPLY|FIX)>([\s\S]*?)<\/\1>/g;
      let last = 0, m;
      while ((m = re.exec(content)) !== null) {
        if (m.index > last) {
          parts.push({ type: 'text', body: content.slice(last, m.index).trim() });
        }
        parts.push({ type: m[1].toLowerCase(), body: m[2].trim() });
        last = re.lastIndex;
      }
      if (last < content.length) {
        parts.push({ type: 'text', body: content.slice(last).trim() });
      }
      return parts.filter(p => p.body);
    },

    // Send an arbitrary body to the thread — used by the clarifier's drafts,
    // which are not the stored reply_draft.
    async sendThreadReplyBody(number, t, body, key) {
      this.replying = key;
      this.myTriageError = '';
      try {
        const r = await fetch(`/api/my_prs/${number}/threads/${t.root_id}/reply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body, kind: t.kind }),
        });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          this.myTriageError = e.detail || `Reply failed (${r.status})`;
        } else if (t.analysis) {
          t.analysis.status = 'replied';
        }
      } catch (e) {
        this.myTriageError = String(e);
      } finally {
        this.replying = null;
      }
    },

    async triagePr(number) {
      this.triaging = number;
      this.myTriageError = '';
      try {
        const r = await fetch(`/api/my_prs/${number}/triage`, { method: 'POST' });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          this.myTriageError = e.detail || `Triage failed (${r.status})`;
        } else {
          await this.loadMyTriage();
        }
      } catch (e) {
        this.myTriageError = String(e);
      } finally {
        this.triaging = null;
      }
    },

    async sendThreadReply(number, t) {
      this.replying = t.root_id;
      this.myTriageError = '';
      try {
        const r = await fetch(`/api/my_prs/${number}/threads/${t.root_id}/reply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body: t.analysis.reply_draft, kind: t.kind }),
        });
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          this.myTriageError = e.detail || `Reply failed (${r.status})`;
        } else {
          t.analysis.status = 'replied';
        }
      } catch (e) {
        this.myTriageError = String(e);
      } finally {
        this.replying = null;
      }
    },

    async markHandedOff(number, t) {
      if (!t.analysis || t.analysis.status !== 'pending') return;
      t.analysis.status = 'handed_off';
      await fetch(`/api/my_prs/${number}/threads/${t.root_id}/handed_off`,
                  { method: 'POST' });
    },

    async skipThread(number, t) {
      await fetch(`/api/my_prs/${number}/threads/${t.root_id}/skip`, { method: 'POST' });
      if (t.analysis) t.analysis.status = 'skipped';
      else t.analysis = { status: 'skipped' };
    },

    // Clicking the instruction selects the whole thing, so copying never
    // depends on the clipboard API being reachable.
    selectAll(el) {
      const r = document.createRange();
      r.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(r);
    },

    // navigator.clipboard needs a secure context AND a focused document, and
    // quietly refuses in embedded or unfocused windows. Fall back to the old
    // textarea + execCommand route, which has neither requirement.
    async copyText(text, key) {
      const ok = () => {
        this.copied = key;
        setTimeout(() => { if (this.copied === key) this.copied = null; }, 2000);
      };
      try {
        await navigator.clipboard.writeText(text);
        return ok();
      } catch (e) { /* fall through */ }
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.select();
        const copied = document.execCommand('copy');
        document.body.removeChild(ta);
        if (copied) return ok();
      } catch (e) { /* fall through */ }
